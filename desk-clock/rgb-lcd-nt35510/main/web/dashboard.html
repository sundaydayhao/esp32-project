<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>室内外温湿度趋势</title>
  <style>
    :root {
      --bg-top: #f4eee3;
      --bg-bottom: #f7f4ef;
      --ink: #1c2b2d;
      --muted: #607072;
      --card: rgba(255, 255, 255, 0.78);
      --line: rgba(28, 43, 45, 0.08);
      --temp-in: #e46f46;
      --temp-out: #c2352a;
      --hum-in: #2490a7;
      --hum-out: #0d5f7a;
      --accent: #1c2b2d;
      --chip: rgba(28, 43, 45, 0.08);
      --shadow: 0 18px 50px rgba(68, 53, 36, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(228, 111, 70, 0.14), transparent 30%),
        radial-gradient(circle at top left, rgba(36, 144, 167, 0.14), transparent 35%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 999px;
      filter: blur(10px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 180px;
      height: 180px;
      right: -50px;
      top: 12vh;
      background: rgba(228, 111, 70, 0.08);
    }

    body::after {
      width: 220px;
      height: 220px;
      left: -70px;
      bottom: 10vh;
      background: rgba(36, 144, 167, 0.08);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    .hero,
    .panel,
    .metric {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: var(--shadow);
    }

    .hero {
      border-radius: 28px;
      padding: 18px;
      overflow: hidden;
    }

    .eyebrow {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 8px 0 10px;
      font-size: 30px;
      line-height: 1.05;
    }

    .subline {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .hero-top,
    .hero-bottom,
    .chart-head,
    .filter-row,
    .legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-bottom { margin-top: 18px; }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge,
    .filter button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      background: var(--chip);
      color: var(--ink);
    }

    .badge strong {
      font-weight: 700;
      margin-left: 4px;
    }

    .filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter button {
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    .filter button.active {
      background: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }

    .metric-grid,
    .chart-grid {
      display: grid;
      gap: 14px;
      margin-top: 14px;
    }

    .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chart-grid { grid-template-columns: 1fr; }

    .metric {
      border-radius: 22px;
      padding: 14px 16px;
    }

    .metric label,
    .panel label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .metric .value {
      margin-top: 8px;
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }

    .metric .hint {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .panel {
      border-radius: 24px;
      padding: 16px;
    }

    .panel h2 {
      margin: 8px 0 0;
      font-size: 22px;
    }

    .panel .subline { font-size: 13px; }

    .chart-wrap {
      margin-top: 14px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(28, 43, 45, 0.07);
    }

    canvas {
      display: block;
      width: 100%;
      height: 260px;
    }

    .legend {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .legend .items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 6px;
    }

    .empty {
      padding: 26px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    @media (min-width: 860px) {
      main { padding: 26px 20px 40px; }
      .metric-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .chart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      canvas { height: 300px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Indoor vs Outdoor</p>
          <h1>室内外温湿度历史对比</h1>
          <p class="subline" id="headline">正在读取设备数据...</p>
        </div>
        <div class="badge-row">
          <span class="badge">设备 IP<strong id="deviceIp">--</strong></span>
          <span class="badge">采样间隔<strong id="sampleInterval">--</strong></span>
          <span class="badge">网络状态<strong id="wifiState">--</strong></span>
        </div>
      </div>
      <div class="hero-bottom">
        <div class="filter-row">
          <div>
            <p class="eyebrow">Time Window</p>
            <p class="subline">切换最近 24 小时、72 小时或 7 天趋势</p>
          </div>
          <div class="filter" id="filterGroup">
            <button type="button" data-hours="24" class="active">24 小时</button>
            <button type="button" data-hours="72">72 小时</button>
            <button type="button" data-hours="168">7 天</button>
          </div>
        </div>
      </div>
    </section>

    <section class="metric-grid">
      <article class="metric">
        <label>室内温度</label>
        <div class="value" id="indoorTemp">--</div>
        <div class="hint" id="indoorTempHint">等待传感器数据</div>
      </article>
      <article class="metric">
        <label>室外温度</label>
        <div class="value" id="outdoorTemp">--</div>
        <div class="hint" id="outdoorTempHint">等待天气数据</div>
      </article>
      <article class="metric">
        <label>室内湿度</label>
        <div class="value" id="indoorHumidity">--</div>
        <div class="hint" id="indoorHumidityHint">等待传感器数据</div>
      </article>
      <article class="metric">
        <label>室外湿度</label>
        <div class="value" id="outdoorHumidity">--</div>
        <div class="hint" id="outdoorHumidityHint">等待天气数据</div>
      </article>
    </section>

    <section class="metric-grid">
      <article class="metric">
        <label>温差</label>
        <div class="value" id="tempDelta">--</div>
        <div class="hint">室内减室外</div>
      </article>
      <article class="metric">
        <label>湿度差</label>
        <div class="value" id="humidityDelta">--</div>
        <div class="hint">室内减室外</div>
      </article>
      <article class="metric">
        <label>历史点数</label>
        <div class="value" id="historyCount">0</div>
        <div class="hint">当前窗口内可视数据</div>
      </article>
      <article class="metric">
        <label>最近记录时间</label>
        <div class="value" id="lastUpdate">--</div>
        <div class="hint">整点历史中的最新一条</div>
      </article>
    </section>

    <section class="chart-grid">
      <article class="panel">
        <div class="chart-head">
          <div>
            <label>Temperature</label>
            <h2>温度曲线</h2>
          </div>
          <p class="subline">单位：摄氏度</p>
        </div>
        <div class="chart-wrap">
          <canvas id="tempChart"></canvas>
          <div class="empty" id="tempEmpty" hidden>暂无温度历史数据</div>
        </div>
        <div class="legend">
          <div class="items">
            <span><i class="dot" style="background: var(--temp-in)"></i>室内温度</span>
            <span><i class="dot" style="background: var(--temp-out)"></i>室外温度</span>
          </div>
          <span id="tempRange">--</span>
        </div>
      </article>

      <article class="panel">
        <div class="chart-head">
          <div>
            <label>Humidity</label>
            <h2>湿度曲线</h2>
          </div>
          <p class="subline">单位：相对湿度 %</p>
        </div>
        <div class="chart-wrap">
          <canvas id="humidityChart"></canvas>
          <div class="empty" id="humidityEmpty" hidden>暂无湿度历史数据</div>
        </div>
        <div class="legend">
          <div class="items">
            <span><i class="dot" style="background: var(--hum-in)"></i>室内湿度</span>
            <span><i class="dot" style="background: var(--hum-out)"></i>室外湿度</span>
          </div>
          <span id="humidityRange">--</span>
        </div>
      </article>
    </section>
  </main>

  <script>
    const state = { hours: 24, payload: null };

    const els = {
      headline: document.getElementById('headline'),
      deviceIp: document.getElementById('deviceIp'),
      sampleInterval: document.getElementById('sampleInterval'),
      wifiState: document.getElementById('wifiState'),
      indoorTemp: document.getElementById('indoorTemp'),
      outdoorTemp: document.getElementById('outdoorTemp'),
      indoorHumidity: document.getElementById('indoorHumidity'),
      outdoorHumidity: document.getElementById('outdoorHumidity'),
      indoorTempHint: document.getElementById('indoorTempHint'),
      outdoorTempHint: document.getElementById('outdoorTempHint'),
      indoorHumidityHint: document.getElementById('indoorHumidityHint'),
      outdoorHumidityHint: document.getElementById('outdoorHumidityHint'),
      tempDelta: document.getElementById('tempDelta'),
      humidityDelta: document.getElementById('humidityDelta'),
      historyCount: document.getElementById('historyCount'),
      lastUpdate: document.getElementById('lastUpdate'),
      tempChart: document.getElementById('tempChart'),
      humidityChart: document.getElementById('humidityChart'),
      tempEmpty: document.getElementById('tempEmpty'),
      humidityEmpty: document.getElementById('humidityEmpty'),
      tempRange: document.getElementById('tempRange'),
      humidityRange: document.getElementById('humidityRange'),
      filterGroup: document.getElementById('filterGroup')
    };

    function formatAge(age) {
      if (age == null || age < 0) return '未知';
      if (age < 60) return age + ' 秒前';
      if (age < 3600) return Math.round(age / 60) + ' 分钟前';
      return (age / 3600).toFixed(1) + ' 小时前';
    }

    function formatTs(ts) {
      if (!ts) return '--';
      const d = new Date(ts * 1000);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}-${dd} ${hh}:${mi}`;
    }

    function formatValue(value, unit) {
      if (value == null || Number.isNaN(value)) return '--';
      return `${value}${unit}`;
    }

    function formatDelta(a, b, unit) {
      if (a == null || b == null) return '--';
      const delta = a - b;
      const sign = delta > 0 ? '+' : '';
      return `${sign}${delta}${unit}`;
    }

    function formatInterval(seconds) {
      if (!seconds) return '--';
      if (seconds % 86400 === 0) return `${seconds / 86400} 天`;
      if (seconds % 3600 === 0) return `${seconds / 3600} 小时`;
      if (seconds % 60 === 0) return `${seconds / 60} 分钟`;
      return `${seconds} 秒`;
    }

    function getWindowedHistory(payload, hours) {
      const history = Array.isArray(payload?.history) ? payload.history : [];
      if (!history.length) return [];
      const latestTs = history[history.length - 1].ts || 0;
      const cutoff = latestTs > 0 ? latestTs - hours * 3600 : 0;
      return history.filter((point) => !cutoff || point.ts >= cutoff);
    }

    function resizeCanvas(canvas) {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width * ratio));
      const height = Math.max(1, Math.floor(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      return { ratio, width, height };
    }

    function drawChart(canvas, emptyEl, series, labels, valueFormatter, rangeEl) {
      const validSeries = series.filter((item) => item.values.length > 0);
      emptyEl.hidden = validSeries.length > 0;
      canvas.hidden = validSeries.length === 0;

      if (!validSeries.length) {
        rangeEl.textContent = '--';
        return;
      }

      const { ratio, width, height } = resizeCanvas(canvas);
      const ctx = canvas.getContext('2d');
      const margin = { top: 24 * ratio, right: 18 * ratio, bottom: 34 * ratio, left: 42 * ratio };
      const chartWidth = width - margin.left - margin.right;
      const chartHeight = height - margin.top - margin.bottom;
      const allValues = validSeries.flatMap((item) => item.values.map((p) => p.value));
      let min = Math.min(...allValues);
      let max = Math.max(...allValues);

      if (min === max) {
        min -= 1;
        max += 1;
      } else {
        const padding = (max - min) * 0.12;
        min -= padding;
        max += padding;
      }

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(28,43,45,0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = margin.top + chartHeight * (i / 4);
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(margin.left + chartWidth, y);
        ctx.stroke();
      }

      const labelStep = Math.max(1, Math.floor(labels.length / 6));
      const shownLabels = labels
        .map((label, index) => ({ label, index }))
        .filter((item) => item.index % labelStep === 0 || item.index === labels.length - 1);
      shownLabels.forEach((item) => {
        const x = margin.left + chartWidth * (item.index / Math.max(1, labels.length - 1));
        ctx.beginPath();
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, margin.top + chartHeight);
        ctx.stroke();
        ctx.fillStyle = '#607072';
        ctx.font = `${11 * ratio}px "Trebuchet MS"`;
        ctx.textAlign = 'center';
        ctx.fillText(item.label, x, height - 10 * ratio);
      });

      for (let i = 0; i <= 4; i++) {
        const value = max - ((max - min) * i / 4);
        const y = margin.top + chartHeight * (i / 4);
        ctx.fillStyle = '#607072';
        ctx.font = `${11 * ratio}px "Trebuchet MS"`;
        ctx.textAlign = 'right';
        ctx.fillText(valueFormatter(value), margin.left - 8 * ratio, y + 4 * ratio);
      }

      validSeries.forEach((item) => {
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 3 * ratio;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        item.values.forEach((point, index) => {
          const x = margin.left + chartWidth * (point.index / Math.max(1, labels.length - 1));
          const y = margin.top + chartHeight * ((max - point.value) / (max - min));
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });

      rangeEl.textContent = `范围 ${valueFormatter(Math.round(min))} ~ ${valueFormatter(Math.round(max))}`;
    }

    function buildSeries(history, keyOk, keyValue) {
      return history
        .map((point, index) => ({ index, value: point[keyOk] ? point[keyValue] : null }))
        .filter((point) => point.value != null);
    }

    function render() {
      const payload = state.payload;
      if (!payload) return;

      const history = getWindowedHistory(payload, state.hours);
      const latestPoint = history[history.length - 1] || null;
      const latest = payload.latest || {};
      const indoor = latest.indoor || {};
      const outdoor = latest.outdoor || {};
      const forecastAvailable = !!outdoor.forecast_available;
      const labels = history.map((point) => formatTs(point.ts));
      const indoorTemp = indoor.available ? indoor.temp : null;
      const outdoorTemp = outdoor.available ? outdoor.temp : null;
      const indoorHumidity = indoor.available ? indoor.humidity : null;
      const outdoorHumidity = outdoor.available ? outdoor.humidity : null;

      els.deviceIp.textContent = payload.ip || '--';
      els.sampleInterval.textContent = formatInterval(payload.sample_interval_s);
      els.wifiState.textContent = payload.wifi_connected ? '已连接' : '未连接';
      els.headline.textContent = payload.wifi_connected
        ? `手机与设备接入同一 Wi-Fi 后，直接访问 http://${payload.ip || '设备IP'}/`
        : '设备尚未连上 Wi-Fi，网页已就绪但暂时无法从手机访问。';

      els.indoorTemp.textContent = formatValue(indoorTemp, '°C');
      els.outdoorTemp.textContent = formatValue(outdoorTemp, '°C');
      els.indoorHumidity.textContent = formatValue(indoorHumidity, '%');
      els.outdoorHumidity.textContent = formatValue(outdoorHumidity, '%');
      els.indoorTempHint.textContent = indoor.available ? `传感器更新于 ${formatAge(indoor.age_s)}` : '等待传感器数据';
      els.indoorHumidityHint.textContent = indoor.available ? `成功 ${indoor.samples || 0} 次 / 错误 ${indoor.errors || 0} 次` : '等待传感器数据';
      els.outdoorTempHint.textContent = outdoor.available ? `天气更新于 ${formatAge(outdoor.age_s)}` : '等待天气数据';
      els.outdoorHumidityHint.textContent = forecastAvailable
        ? `今日 ${formatValue(outdoor.temp_low, '°')} ~ ${formatValue(outdoor.temp_high, '°')}`
        : '等待天气预报';
      els.tempDelta.textContent = formatDelta(indoorTemp, outdoorTemp, '°C');
      els.humidityDelta.textContent = formatDelta(indoorHumidity, outdoorHumidity, '%');
      els.historyCount.textContent = String(history.length);
      els.lastUpdate.textContent = latestPoint ? formatTs(latestPoint.ts) : '--';

      drawChart(
        els.tempChart,
        els.tempEmpty,
        [
          { color: getComputedStyle(document.documentElement).getPropertyValue('--temp-in').trim(), values: buildSeries(history, 'in_ok', 'in_t') },
          { color: getComputedStyle(document.documentElement).getPropertyValue('--temp-out').trim(), values: buildSeries(history, 'out_ok', 'out_t') }
        ],
        labels,
        (value) => `${Math.round(value)}°`,
        els.tempRange
      );

      drawChart(
        els.humidityChart,
        els.humidityEmpty,
        [
          { color: getComputedStyle(document.documentElement).getPropertyValue('--hum-in').trim(), values: buildSeries(history, 'in_ok', 'in_h') },
          { color: getComputedStyle(document.documentElement).getPropertyValue('--hum-out').trim(), values: buildSeries(history, 'out_ok', 'out_h') }
        ],
        labels,
        (value) => `${Math.round(value)}%`,
        els.humidityRange
      );
    }

    async function loadData() {
      try {
        const response = await fetch('/api/history', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        state.payload = await response.json();
        render();
      } catch (error) {
        els.headline.textContent = '读取失败，请确认设备已联网且接口正常。';
      }
    }

    els.filterGroup.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-hours]');
      if (!button) return;
      state.hours = Number(button.dataset.hours);
      Array.from(els.filterGroup.querySelectorAll('button')).forEach((el) => {
        el.classList.toggle('active', el === button);
      });
      render();
    });

    window.addEventListener('resize', render);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadData();
    });

    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>

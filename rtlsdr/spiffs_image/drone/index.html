<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>无人机监测告警</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#0d1117;color:#e6edf3;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .header{background:#161b22;border-bottom:1px solid #30363d;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .header h1{font-size:15px;color:#f85149;white-space:nowrap}
    .btn{padding:5px 12px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
    .btn-green{background:#238636;color:#fff}.btn-green:hover{background:#2ea043}
    .btn-green:disabled{background:#21262d;color:#8b949e;cursor:not-allowed}
    .btn-red{background:#da3633;color:#fff}.btn-red:hover{background:#f85149}
    .btn-red:disabled{background:#21262d;color:#8b949e;cursor:not-allowed}
    .btn-gray{background:#21262d;color:#e6edf3;border:1px solid #30363d}.btn-gray:hover{background:#30363d}
    .nav-links{display:flex;gap:8px;font-size:12px;margin-left:auto}
    .nav-links a{color:#58a6ff;text-decoration:none;padding:3px 8px;border:1px solid #30363d;border-radius:5px}
    .nav-links a:hover{background:#21262d}
    .status-pill{display:flex;align-items:center;gap:6px;padding:3px 10px;background:#21262d;border-radius:20px;font-size:12px}
    .dot{width:7px;height:7px;border-radius:50%;background:#f85149;flex-shrink:0}
    .dot.active{background:#3fb950;animation:pulse 2s infinite}
    .dot.loading{background:#d29922;animation:pulse .8s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    /* 统计栏 */
    .stats-bar{background:#0d1117;border-bottom:1px solid #21262d;padding:5px 14px;display:flex;gap:20px;font-size:11px;color:#8b949e;flex-shrink:0}
    .stats-bar strong{color:#e6edf3}
    /* 主区域 */
    .main{flex:1;display:flex;min-height:0}
    /* 频段面板 */
    .band-panel{width:340px;flex-shrink:0;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
    .panel-hdr{padding:7px 12px;font-size:11px;color:#8b949e;border-bottom:1px solid #21262d;background:#161b22;display:flex;justify-content:space-between}
    .band-list{flex:1;overflow-y:auto;padding:8px}
    .band-list::-webkit-scrollbar{width:5px}
    .band-list::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
    .band-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 12px;margin-bottom:8px;transition:border-color .2s}
    .band-card.alert-low{border-color:#d29922}
    .band-card.alert-med{border-color:#f0883e}
    .band-card.alert-high{border-color:#f85149;animation:blink .5s infinite}
    @keyframes blink{0%,100%{border-color:#f85149}50%{border-color:#7a1a1a}}
    .band-name{font-size:13px;font-weight:700;color:#e6edf3}
    .band-desc{font-size:11px;color:#8b949e;margin-bottom:6px}
    .band-meter{height:6px;background:#21262d;border-radius:3px;margin:4px 0;overflow:hidden}
    .band-meter-fill{height:100%;border-radius:3px;transition:width .3s}
    .band-vals{display:flex;justify-content:space-between;font-size:11px;color:#8b949e}
    .alert-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-left:6px}
    .badge-none{background:#21262d;color:#8b949e}
    .badge-low{background:#3a3a1a;color:#d29922}
    .badge-med{background:#3a2a1a;color:#f0883e}
    .badge-high{background:#3a1a1a;color:#f85149}
    /* 告警日志 */
    .log-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .log-list{flex:1;overflow-y:auto;font-size:12px;font-family:monospace}
    .log-list::-webkit-scrollbar{width:5px}
    .log-list::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
    .log-row{padding:6px 14px;border-bottom:1px solid #161b22;display:flex;gap:10px;align-items:center}
    .log-row:hover{background:#161b22}
    .log-ts{color:#8b949e;white-space:nowrap;font-size:11px}
    .log-band{color:#58a6ff;font-weight:700;min-width:60px}
    .log-power{color:#e6edf3;min-width:70px}
    .log-snr{color:#3fb950;min-width:60px}
    .log-level{font-weight:700}
    .log-level.low{color:#d29922}
    .log-level.med{color:#f0883e}
    .log-level.high{color:#f85149}
    .log-active{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .log-active.on{background:#f85149;animation:pulse 1s infinite}
    .log-active.off{background:#30363d}
    /* 配置面板 */
    .config-panel{padding:12px 14px;border-top:1px solid #30363d;background:#161b22;font-size:12px}
    .config-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    .config-label{color:#8b949e;width:100px}
    .config-input{background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#e6edf3;padding:3px 8px;width:80px;font-size:12px}
    .config-input:focus{outline:none;border-color:#58a6ff}
    /* 大告警横幅 */
    .alert-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:100;background:#7a1a1a;border-bottom:3px solid #f85149;padding:10px 20px;text-align:center;font-size:16px;font-weight:700;color:#fff;animation:blink .5s infinite}
    .alert-banner.show{display:block}
  </style>
</head>
<body>

<div class="alert-banner" id="alert-banner">&#9888; 检测到无人机信号！</div>

<div class="header">
  <h1>&#128641; 无人机监测告警</h1>
  <button class="btn btn-green" id="btn-start" onclick="startScan()">&#9654; 启动扫描</button>
  <button class="btn btn-red"   id="btn-stop"  onclick="stopScan()" disabled>&#9632; 停止</button>
  <button class="btn btn-gray"  onclick="clearLog()">&#128465; 清除日志</button>
  <div class="nav-links">
    <a href="/">&#127968; 首页</a>
    <a href="/adsb/">&#9992; ADS-B</a>
    <a href="/ais/">&#9875; AIS</a>
    <a href="/spectrum/">&#128202; 频谱</a>
  </div>
  <div class="status-pill">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">未启动</span>
  </div>
</div>

<div class="stats-bar">
  <span>扫描次数: <strong id="scan-count">0</strong></span>
  <span>总告警: <strong id="total-alerts">0</strong></span>
  <span>活跃告警: <strong id="active-alerts" style="color:#f85149">0</strong></span>
  <span>运行时间: <strong id="uptime">0s</strong></span>
</div>

<div class="main">
  <!-- 频段状态 -->
  <div class="band-panel">
    <div class="panel-hdr"><span>频段监测</span><span id="band-count">6 个频段</span></div>
    <div class="band-list" id="band-list"></div>
    <!-- 配置 -->
    <div class="config-panel">
      <div style="font-size:11px;color:#8b949e;margin-bottom:6px">告警阈值 (SNR dB)</div>
      <div class="config-row">
        <span class="config-label" style="color:#d29922">低级告警</span>
        <input class="config-input" id="cfg-low"  type="number" value="10" min="1" max="50">
        <span style="color:#8b949e">dB</span>
      </div>
      <div class="config-row">
        <span class="config-label" style="color:#f0883e">中级告警</span>
        <input class="config-input" id="cfg-med"  type="number" value="20" min="1" max="50">
        <span style="color:#8b949e">dB</span>
      </div>
      <div class="config-row">
        <span class="config-label" style="color:#f85149">高级告警</span>
        <input class="config-input" id="cfg-high" type="number" value="30" min="1" max="50">
        <span style="color:#8b949e">dB</span>
      </div>
      <div class="config-row">
        <span class="config-label" style="color:#8b949e">驻留时间</span>
        <input class="config-input" id="cfg-dwell" type="number" value="300" min="50" max="2000">
        <span style="color:#8b949e">ms</span>
      </div>
      <button class="btn btn-gray" style="width:100%;margin-top:4px" onclick="saveConfig()">保存配置</button>
    </div>
  </div>

  <!-- 告警日志 -->
  <div class="log-panel">
    <div class="panel-hdr">
      <span>告警日志</span>
      <span style="color:#8b949e;font-size:10px">实时更新</span>
    </div>
    <div style="display:flex;padding:4px 14px;font-size:10px;color:#8b949e;border-bottom:1px solid #21262d;gap:10px">
      <span style="min-width:8px"></span>
      <span style="min-width:80px">时间</span>
      <span style="min-width:60px">频段</span>
      <span style="min-width:70px">功率</span>
      <span style="min-width:60px">SNR</span>
      <span>级别</span>
    </div>
    <div class="log-list" id="log-list">
      <div style="padding:20px;text-align:center;color:#8b949e">启动扫描后显示告警记录</div>
    </div>
  </div>
</div>

<script src="/drone/app.js"></script>
</body>
</html>

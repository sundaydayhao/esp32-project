<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32-S3 AIS 船舶监控</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* 顶部工具栏 */
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 15px; color: #58a6ff; white-space: nowrap; }
    .btn {
      padding: 5px 12px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn-primary { background: #238636; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
    .btn-danger  { background: #da3633; color: #fff; }
    .btn-danger:hover  { background: #f85149; }
    .btn-danger:disabled  { background: #21262d; color: #8b949e; cursor: not-allowed; }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 10px; background: #21262d;
      border-radius: 20px; font-size: 12px; margin-left: auto;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #f85149; flex-shrink: 0; }
    .dot.active { background: #3fb950; animation: pulse 2s infinite; }
    .dot.loading { background: #d29922; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .nav-links { display: flex; gap: 10px; font-size: 12px; }
    .nav-links a { color: #58a6ff; text-decoration: none; padding: 3px 8px;
                   border: 1px solid #30363d; border-radius: 5px; }
    .nav-links a:hover { background: #21262d; }
    /* 状态栏 */
    .status-bar {
      background: #0d1117; border-bottom: 1px solid #21262d;
      padding: 5px 14px; display: flex; gap: 20px;
      font-size: 11px; color: #8b949e; flex-shrink: 0;
    }
    .status-bar strong { color: #e6edf3; }
    /* 主区域 */
    .main { flex: 1; display: flex; min-height: 0; }
    /* 船只列表 */
    .vessel-panel {
      width: 320px; flex-shrink: 0;
      border-right: 1px solid #30363d;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-title {
      padding: 7px 12px; font-size: 11px; color: #8b949e;
      border-bottom: 1px solid #21262d; background: #161b22;
      display: flex; justify-content: space-between; align-items: center;
    }
    #vessel-list { flex: 1; overflow-y: auto; font-size: 12px; }
    #vessel-list::-webkit-scrollbar { width: 5px; }
    #vessel-list::-webkit-scrollbar-track { background: #0d1117; }
    #vessel-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .v-row {
      padding: 8px 12px; border-bottom: 1px solid #21262d;
      cursor: pointer; transition: background 0.1s;
    }
    .v-row:hover { background: #161b22; }
    .v-row.selected { background: #1a3a5c; border-left: 3px solid #58a6ff; }
    .v-mmsi { font-weight: 700; color: #58a6ff; font-size: 12px; font-family: monospace; }
    .v-name { color: #e6edf3; font-weight: 600; margin-left: 6px; }
    .v-type { color: #8b949e; font-size: 11px; }
    .v-info { color: #8b949e; margin-top: 2px; font-size: 11px; }
    .v-status {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 10px; font-weight: 600; margin-left: 4px;
    }
    .v-status.underway { background: #1a4a1a; color: #3fb950; }
    .v-status.anchored { background: #3a3a1a; color: #d29922; }
    .v-status.moored   { background: #1a2a4a; color: #58a6ff; }
    .v-status.other    { background: #2a1a1a; color: #f85149; }
    /* 地图 */
    .map-panel { flex: 1; position: relative; overflow: hidden; }
    #map-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    /* 详情面板 */
    .detail-panel {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(22,27,34,0.96); border: 1px solid #30363d;
      border-radius: 10px; padding: 12px 16px; font-size: 12px;
      min-width: 220px; max-width: 280px; display: none;
    }
    .detail-panel.show { display: block; }
    .detail-title { font-size: 14px; font-weight: 700; color: #58a6ff; margin-bottom: 8px; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
    .detail-label { color: #8b949e; white-space: nowrap; }
    .detail-value { color: #e6edf3; font-weight: 600; text-align: right; }
    /* 地图控件 */
    .map-controls {
      position: absolute; top: 10px; right: 10px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .map-btn {
      width: 28px; height: 28px; background: rgba(22,27,34,0.9);
      border: 1px solid #30363d; border-radius: 6px; color: #e6edf3;
      font-size: 16px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .map-btn:hover { background: #21262d; }
    /* 图例 */
    .legend {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(22,27,34,0.9); border: 1px solid #30363d;
      border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #8b949e;
    }
    .legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="header">
  <h1>⚓ AIS 船舶监控</h1>
  <button class="btn btn-primary" id="btn-start" onclick="startAIS()">▶ 启动</button>
  <button class="btn btn-danger"  id="btn-stop"  onclick="stopAIS()" disabled>■ 停止</button>
  <div class="nav-links">
    <a href="/">🏠 首页</a>
    <a href="/adsb/">✈ ADS-B</a>
    <a href="/fm/">📻 FM</a>
    <a href="/spectrum/">📡 频谱</a>
  </div>
  <div class="status-pill">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">未连接</span>
  </div>
</div>

<div class="status-bar">
  <span>船只: <strong id="vessel-count">0</strong></span>
  <span>有效帧: <strong id="valid-frames">0</strong></span>
  <span>CRC错误: <strong id="crc-errors">0</strong></span>
  <span>CH-A: <strong id="ch-a">0</strong></span>
  <span>CH-B: <strong id="ch-b">0</strong></span>
  <span>运行: <strong id="uptime">0s</strong></span>
</div>

<div class="main">
  <!-- 船只列表 -->
  <div class="vessel-panel">
    <div class="panel-title">
      <span>船只列表</span>
      <span id="list-count">0 艘</span>
    </div>
    <div id="vessel-list"></div>
  </div>

  <!-- 地图 -->
  <div class="map-panel">
    <canvas id="map-canvas"></canvas>

    <!-- 地图控件 -->
    <div class="map-controls">
      <div class="map-btn" onclick="mapZoomIn()" title="放大">+</div>
      <div class="map-btn" onclick="mapZoomOut()" title="缩小">−</div>
      <div class="map-btn" onclick="mapFitAll()" title="显示全部">⊡</div>
    </div>

    <!-- 图例 -->
    <div class="legend">
      <div class="legend-row"><div class="legend-dot" style="background:#3fb950"></div>航行中</div>
      <div class="legend-row"><div class="legend-dot" style="background:#d29922"></div>锚泊/系泊</div>
      <div class="legend-row"><div class="legend-dot" style="background:#58a6ff"></div>客船/货船</div>
      <div class="legend-row"><div class="legend-dot" style="background:#f85149"></div>油轮/危险品</div>
      <div class="legend-row"><div class="legend-dot" style="background:#e6edf3"></div>其他</div>
    </div>

    <!-- 详情面板 -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-title" id="d-name">—</div>
      <div class="detail-row"><span class="detail-label">MMSI</span><span class="detail-value" id="d-mmsi">—</span></div>
      <div class="detail-row"><span class="detail-label">呼号</span><span class="detail-value" id="d-callsign">—</span></div>
      <div class="detail-row"><span class="detail-label">IMO</span><span class="detail-value" id="d-imo">—</span></div>
      <div class="detail-row"><span class="detail-label">船型</span><span class="detail-value" id="d-shiptype">—</span></div>
      <div class="detail-row"><span class="detail-label">状态</span><span class="detail-value" id="d-navstatus">—</span></div>
      <div class="detail-row"><span class="detail-label">位置</span><span class="detail-value" id="d-pos">—</span></div>
      <div class="detail-row"><span class="detail-label">航速</span><span class="detail-value" id="d-sog">—</span></div>
      <div class="detail-row"><span class="detail-label">航向</span><span class="detail-value" id="d-cog">—</span></div>
      <div class="detail-row"><span class="detail-label">目的港</span><span class="detail-value" id="d-dest">—</span></div>
      <div class="detail-row"><span class="detail-label">消息数</span><span class="detail-value" id="d-msgs">—</span></div>
    </div>
  </div>
</div>

<script src="/ais/app.js"></script>
</body>
</html>

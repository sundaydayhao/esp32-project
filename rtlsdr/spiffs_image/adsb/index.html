<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32-S3 ADS-B 飞机追踪</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 16px; color: #58a6ff; }
    .nav-links { display: flex; gap: 12px; margin-left: auto; font-size: 13px; }
    .nav-links a { color: #58a6ff; text-decoration: none; padding: 4px 10px;
                   border: 1px solid #30363d; border-radius: 6px; }
    .nav-links a:hover { background: #21262d; }
    .status-bar {
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      padding: 6px 16px;
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: #8b949e;
      flex-shrink: 0;
    }
    .status-bar span { white-space: nowrap; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
           background: #f85149; margin-right: 5px; }
    .dot.active { background: #3fb950; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .main { flex: 1; display: flex; min-height: 0; }
    /* 飞机列表 */
    .aircraft-panel {
      width: 340px;
      flex-shrink: 0;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-title {
      padding: 8px 12px;
      font-size: 12px;
      color: #8b949e;
      border-bottom: 1px solid #21262d;
      background: #161b22;
    }
    #aircraft-list {
      flex: 1;
      overflow-y: auto;
      font-size: 12px;
    }
    #aircraft-list::-webkit-scrollbar { width: 6px; }
    #aircraft-list::-webkit-scrollbar-track { background: #0d1117; }
    #aircraft-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .ac-row {
      padding: 8px 12px;
      border-bottom: 1px solid #21262d;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ac-row:hover { background: #161b22; }
    .ac-row.selected { background: #1f3a5f; }
    .ac-icao { font-weight: 700; color: #58a6ff; font-size: 13px; }
    .ac-callsign { color: #3fb950; margin-left: 8px; }
    .ac-info { color: #8b949e; margin-top: 3px; }
    /* 地图 */
    .map-panel { flex: 1; position: relative; overflow: hidden; }
    #map-canvas { width: 100%; height: 100%; display: block; }
    /* 详情面板 */
    .detail-panel {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(22,27,34,0.95);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      min-width: 200px;
      display: none;
    }
    .detail-panel.show { display: block; }
    .detail-title { font-size: 14px; font-weight: 700; color: #58a6ff; margin-bottom: 8px; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .detail-label { color: #8b949e; }
    .detail-value { color: #e6edf3; font-weight: 600; }
  </style>
</head>
<body>

<div class="header">
  <h1>✈ ADS-B 飞机追踪</h1>
  <div class="nav-links">
    <a href="/fm/">📻 FM 收音机</a>
    <a href="/spectrum/">📡 频谱仪</a>
  </div>
</div>

<div class="status-bar">
  <span><span class="dot" id="ws-dot"></span><span id="ws-status">未连接</span></span>
  <span>飞机: <strong id="ac-count">0</strong></span>
  <span>消息: <strong id="msg-count">0</strong></span>
  <span>CRC错误: <strong id="crc-count">0</strong></span>
  <span>运行时间: <strong id="uptime">0s</strong></span>
</div>

<div class="main">
  <!-- 飞机列表 -->
  <div class="aircraft-panel">
    <div class="panel-title">飞机列表 (<span id="list-count">0</span>)</div>
    <div id="aircraft-list"></div>
  </div>

  <!-- 地图 -->
  <div class="map-panel">
    <canvas id="map-canvas"></canvas>
    <!-- 详情面板 -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-title" id="detail-icao">—</div>
      <div class="detail-row"><span class="detail-label">呼号</span><span class="detail-value" id="d-callsign">—</span></div>
      <div class="detail-row"><span class="detail-label">高度</span><span class="detail-value" id="d-alt">—</span></div>
      <div class="detail-row"><span class="detail-label">速度</span><span class="detail-value" id="d-speed">—</span></div>
      <div class="detail-row"><span class="detail-label">航向</span><span class="detail-value" id="d-heading">—</span></div>
      <div class="detail-row"><span class="detail-label">垂直速率</span><span class="detail-value" id="d-vrate">—</span></div>
      <div class="detail-row"><span class="detail-label">位置</span><span class="detail-value" id="d-pos">—</span></div>
      <div class="detail-row"><span class="detail-label">消息数</span><span class="detail-value" id="d-msgs">—</span></div>
    </div>
  </div>
</div>

<script src="/adsb/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32-S3 FM 收音机</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 22px;
      color: #58a6ff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 28px;
    }

    /* 频率显示 */
    .freq-display {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .freq-value {
      font-size: 48px;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    .freq-unit {
      font-size: 18px;
      color: #8b949e;
      margin-left: 4px;
    }

    /* 频率滑块 */
    .slider-wrap {
      margin-bottom: 20px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    input[type=range] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: #21262d;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #58a6ff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(88,166,255,0.5);
    }

    /* 预设频道 */
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .preset-btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover { background: #2d333b; border-color: #58a6ff; }
    .preset-btn.active { background: #1f3a5f; border-color: #58a6ff; color: #58a6ff; }

    /* 控制按钮 */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-start {
      background: #238636;
      color: #fff;
    }
    .btn-start:hover { background: #2ea043; }
    .btn-start:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    .btn-stop {
      background: #da3633;
      color: #fff;
    }
    .btn-stop:hover { background: #f85149; }
    .btn-stop:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    /* 音量 */
    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .volume-wrap label {
      font-size: 13px;
      color: #8b949e;
      white-space: nowrap;
      width: 40px;
    }

    /* 状态栏 */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 13px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f85149;
      flex-shrink: 0;
    }
    .dot.active { background: #3fb950; animation: pulse 2s infinite; }
    .dot.loading { background: #d29922; animation: pulse 0.8s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #status-text { color: #8b949e; }

    /* 导航 */
    .nav {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }

    .nav a {
      color: #58a6ff;
      text-decoration: none;
    }
    .nav a:hover { text-decoration: underline; }

    /* 音频可视化 */
    #visualizer {
      width: 100%;
      height: 60px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📻 FM 收音机</h1>
  <p class="subtitle">ESP32-S3 + RTL-SDR &nbsp;|&nbsp; 87.5 – 108.0 MHz</p>

  <!-- 频率显示 -->
  <div class="freq-display">
    <span class="freq-value" id="freq-display">100.0</span>
    <span class="freq-unit">MHz</span>
  </div>

  <!-- 频率滑块 -->
  <div class="slider-wrap">
    <div class="slider-labels">
      <span>87.5 MHz</span>
      <span>108.0 MHz</span>
    </div>
    <input type="range" id="freq-slider"
           min="87500" max="108000" step="100" value="100000"
           oninput="onSliderInput(this.value)" />
  </div>

  <!-- 预设频道 -->
  <div class="presets" id="presets">
    <button class="preset-btn" onclick="setFreq(87900)">87.9</button>
    <button class="preset-btn" onclick="setFreq(88700)">88.7</button>
    <button class="preset-btn" onclick="setFreq(90000)">90.0</button>
    <button class="preset-btn" onclick="setFreq(91500)">91.5</button>
    <button class="preset-btn" onclick="setFreq(93000)">93.0</button>
    <button class="preset-btn" onclick="setFreq(95000)">95.0</button>
    <button class="preset-btn" onclick="setFreq(97400)">97.4</button>
    <button class="preset-btn" onclick="setFreq(100000)">100.0</button>
    <button class="preset-btn" onclick="setFreq(103800)">103.8</button>
    <button class="preset-btn" onclick="setFreq(106600)">106.6</button>
  </div>

  <!-- 音频可视化 -->
  <canvas id="visualizer"></canvas>

  <!-- 音量 -->
  <div class="volume-wrap">
    <label>🔊</label>
    <input type="range" id="volume-slider"
           min="0" max="2" step="0.05" value="1"
           oninput="setVolume(this.value)" style="flex:1" />
    <span id="volume-label" style="font-size:13px;color:#8b949e;width:36px;text-align:right">100%</span>
  </div>

  <!-- 控制按钮 -->
  <div class="controls">
    <button class="btn btn-start" id="btn-start" onclick="startFM()">▶ 开始收听</button>
    <button class="btn btn-stop"  id="btn-stop"  onclick="stopFM()" disabled>■ 停止</button>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">未连接</span>
  </div>
</div>

<div class="nav">
  <a href="/">← 返回 ADS-B 飞机追踪</a>
</div>

<script src="/fm/app.js"></script>
</body>
</html>
